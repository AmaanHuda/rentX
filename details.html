<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RentX — Vehicle Details</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="wrap">
      <div class="logo">Rent<span>X</span></div>
      <div class="nav-links">
        <a href="index.html">Vehicles</a>
        <a href="bookings.html">My Bookings</a>
      </div>
    </div>
  </nav>

  <main class="wrap" id="detailsRoot">
    <!-- Filled by details.js. If no vehicle matches the id in the URL,
         details.js renders a "not found" state here instead. -->
  </main>

  <div class="modal-overlay" id="successModal">
    <div class="modal-card">
      <div class="modal-icon">✓</div>
      <h3>Booking confirmed</h3>
      <p>Your vehicle is reserved. Save this ID for your records.</p>
      <div class="booking-id" id="modalBookingId"></div>
      <button class="btn btn-primary btn-block" id="modalContinue">Go to My Bookings</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <footer>RentX — a student portfolio project. Not a real rental service.</footer>

  <script src="js/data.js"></script>
  <script src="js/details.js"></script>
</body>
</html>
